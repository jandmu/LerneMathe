name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium für die Browser-Tests installieren
        run: npx playwright install --with-deps chromium
      - name: Rechenkern, Inhalte, Lernplan
        run: npm test
      - name: Browser-Tests (Handy-Größe)
        run: npm run test:browser
